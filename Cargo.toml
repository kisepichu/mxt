[workspace]
resolver = "3"
# `spike/*` holds throwaway phase 0 programs; it only exists on spike branches.
members = ["crates/*", "spike/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/kisepichu/mxt"

# Every third-party dependency is declared here once, and crates refer to it
# with `<name>.workspace = true`, so versions cannot drift between crates.
[workspace.dependencies]
mxt-core = { path = "crates/mxt-core" }
mxt-matrix = { path = "crates/mxt-matrix" }
mxt-tui = { path = "crates/mxt-tui" }

nucleo-matcher = "0.3"

# Used by the phase 0 edtui check (`spike/edtui-cjk`).
crossterm = "0.29"
edtui = { version = "0.11", default-features = false, features = ["system-editor"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29"] }
serde_json = "1"
unicode-width = "0.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Dependencies keep only line tables, which keeps the target directory smaller
# and linking lighter; the workspace crates keep full debug information.
[profile.dev.package."*"]
debug = "line-tables-only"
