[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/kisepichu/mxt"

# Every third-party dependency is declared here once, and crates refer to it
# with `<name>.workspace = true`, so versions cannot drift between crates.
[workspace.dependencies]
mxt-core = { path = "crates/mxt-core" }
mxt-matrix = { path = "crates/mxt-matrix" }
mxt-tui = { path = "crates/mxt-tui" }

# OSC 52 clipboard writes.
base64 = "0.23"
# The version ratatui 0.30 uses, so there is one crossterm in the tree.
crossterm = { version = "0.29", features = ["event-stream"] }
# The composer and the message view. The system clipboard (arboard), mouse
# support and syntax highlighting are left out.
edtui = { version = "0.11", default-features = false, features = ["system-editor"] }
# The reaction picker's emoji and shortcodes; also what matrix-sdk-ui uses.
emojis = "0.9"
futures-util = "0.3"
jiff = "1"
matrix-sdk = { version = "0.19", default-features = false, features = ["e2e-encryption", "sqlite", "rustls-aws-lc-rs"] }
matrix-sdk-ui = { version = "0.19", default-features = false }
nucleo-matcher = "0.3"
# Only the offsets of code spans and blocks, for mentions; the HTML renderer
# and the command line tool are left out.
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = "0.30"
rpassword = "7"
# Feature-only: the code uses the SDK's ruma through `matrix_sdk::ruma`, and
# this enables `html-matrix` on it for typed HTML elements (the SDK enables
# only `html`). The version matrix-sdk 0.19.1 uses, so there is one ruma in
# the tree.
ruma = { version = "0.17.2", default-features = false, features = ["html-matrix"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
# Reading only: the `display` feature (serialization) is left out.
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# ratatui draws text per grapheme cluster; the view cuts text at the same
# boundaries.
unicode-segmentation = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Dependencies keep only line tables, which keeps the target directory smaller
# and linking lighter; the workspace crates keep full debug information.
[profile.dev.package."*"]
debug = "line-tables-only"
