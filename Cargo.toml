[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/kisepichu/mxt"

# Every third-party dependency is declared here once, and crates refer to it
# with `<name>.workspace = true`, so versions cannot drift between crates.
[workspace.dependencies]
mxt-core = { path = "crates/mxt-core" }
mxt-matrix = { path = "crates/mxt-matrix" }
mxt-tui = { path = "crates/mxt-tui" }

# OSC 52 clipboard writes.
base64 = "0.23"
# The version ratatui 0.30 uses, so there is one crossterm in the tree.
crossterm = { version = "0.29", features = ["event-stream"] }
# The composer and the message view. The system clipboard (arboard), mouse
# support and syntax highlighting are left out.
edtui = { version = "0.11", default-features = false, features = ["system-editor"] }
# The reaction picker's emoji and shortcodes; also what matrix-sdk-ui uses.
emojis = "0.9"
futures-util = "0.3"
# Decoding images for the message view, and reading the dimensions of
# uploaded images from their header, in the formats Matrix clients send. The
# default formats (AVIF through rav1e and libfuzzer-sys) pull in a license the
# policy rejects.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
jiff = "1"
matrix-sdk = { version = "0.19", default-features = false, features = ["e2e-encryption", "sqlite", "rustls-aws-lc-rs"] }
# Events and sync responses for the tests against `MatrixMockServer`; the
# version matrix-sdk 0.19.1 uses.
matrix-sdk-test = "0.19"
matrix-sdk-ui = { version = "0.19", default-features = false }
# The MIME type of an upload, guessed from its file name; also the `mime`
# version matrix-sdk takes. The reverse mapping (extensions of a MIME type)
# is left out.
mime_guess = { version = "2", default-features = false }
nucleo-matcher = "0.3"
# Only the offsets of code spans and blocks, for mentions; the HTML renderer
# and the command line tool are left out.
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = "0.30"
# Images in the message view, in the terminal's graphics protocol. The
# defaults link the native chafa library and enable image's default formats.
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
rpassword = "7"
# Feature-only: the code uses the SDK's ruma through `matrix_sdk::ruma`, and
# this enables `html-matrix` on it for typed HTML elements (the SDK enables
# only `html`), and `markdown` for `FormattedBody::markdown`, which turns the
# composer's Markdown into the HTML body. The version matrix-sdk 0.19.1 uses,
# so there is one ruma in the tree.
ruma = { version = "0.17.2", default-features = false, features = ["html-matrix", "markdown"] }
# Reading the terminal's answer to mxt's own query with a timeout and without
# std's buffer (`VMIN`/`VTIME`), and the window's size in pixels. The version
# and features crossterm uses, so this adds nothing to the build.
rustix = { version = "1", default-features = false, features = ["std", "termios"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
# Reading only: the `display` feature (serialization) is left out.
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# ratatui draws text per grapheme cluster; the view cuts text at the same
# boundaries.
unicode-segmentation = "1"
# Requests matrix-sdk's `MatrixMockServer` has no mock for (`/join` by ID or
# alias, the `m.direct` account data) and the requests it received, in the
# tests of `:join`; the version and features matrix-sdk's `testing` feature
# uses.
wiremock = { version = "0.6.5", default-features = false }

# edtui from mxt's fork (design, "Nix flake"): the `mxt` branch of
# kisepichu/edtui, which is 0.11.8 with the cursor and wrapping measured by
# grapheme cluster and vim's character classes for word motions. Pinned to a
# commit, tagged `mxt-<short hash>` in the fork so that it stays reachable;
# the flake fetches it by that commit.
[patch.crates-io]
edtui = { git = "https://github.com/kisepichu/edtui", rev = "1182cb9c02f671f56a63c7da6a532d91e12755f1" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Dependencies keep only line tables, which keeps the target directory smaller
# and linking lighter; the workspace crates keep full debug information.
[profile.dev.package."*"]
debug = "line-tables-only"
