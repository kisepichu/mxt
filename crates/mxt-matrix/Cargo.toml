[package]
name = "mxt-matrix"
description = "matrix-rust-sdk adapter of mxt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
futures-util.workspace = true
image.workspace = true
matrix-sdk.workspace = true
matrix-sdk-ui.workspace = true
mime_guess.workspace = true
mxt-core.workspace = true
ruma.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
# `MatrixMockServer`, for the tests of the send queue paths. Features of
# dev-dependencies apply only when tests are built, so mxt itself is built
# without them.
matrix-sdk = { workspace = true, features = ["testing"] }
matrix-sdk-test.workspace = true

[lints]
workspace = true
