name: CI

# Pushes to pull request branches run through `pull_request`, so `push` only
# needs `main`; this avoids running every job twice.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest runs on Apple Silicon.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Enter the development shell
        run: nix develop -c true
      # The cache key must follow the flake's toolchain, not the runner's.
      - uses: Swatinem/rust-cache@v2
        with:
          cmd-format: nix develop -c {0}
      - run: nix develop -c cargo fmt --check
      - run: nix develop -c cargo clippy --locked --all-targets -- -D warnings
      - run: nix develop -c cargo test --locked
      - run: nix develop -c cargo deny check licenses advisories sources
