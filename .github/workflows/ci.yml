name: CI

# Pushes to pull request branches run through `pull_request`, so `push` only
# needs `main`; this avoids running every job twice.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest runs on Apple Silicon.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Enter the development shell
        run: nix develop -c true
      # release.yml builds the release binaries with rustup's Rust at the
      # flake's rustc version (docs/releasing.md), so the two must not drift.
      - name: Check release.yml's Rust version
        run: |
          pinned=$(sed -n 's/^  RUSTUP_TOOLCHAIN: "\(.*\)"$/\1/p' .github/workflows/release.yml)
          flake=$(nix develop -c rustc --version | cut -d ' ' -f 2)
          if [ -z "$pinned" ]; then
            echo "::error::No RUSTUP_TOOLCHAIN: \"<version>\" line in .github/workflows/release.yml"
            exit 1
          fi
          if [ "$pinned" != "$flake" ]; then
            echo "::error::RUSTUP_TOOLCHAIN in .github/workflows/release.yml is $pinned, but the flake's rustc is $flake; set it to \"$flake\""
            exit 1
          fi
          echo "RUSTUP_TOOLCHAIN and the flake's rustc are both $flake"
      # The cache key must follow the flake's toolchain, not the runner's.
      - uses: Swatinem/rust-cache@v2
        with:
          cmd-format: nix develop -c {0}
      - run: nix develop -c cargo fmt --check
      - run: nix develop -c cargo clippy --locked --all-targets -- -D warnings
      - run: nix develop -c cargo test --locked
      - run: nix develop -c cargo deny check licenses advisories sources
