# `licenses`, `advisories` and `sources` are checked (see the CI workflow).

[licenses]
version = 2
confidence-threshold = 0.8
# Permissive licenses and MPL-2.0. GPL-family licenses, including the AGPL,
# are rejected by not being listed.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[licenses.private]
# The workspace crates are not published.
ignore = true

[advisories]
version = 2
# Unmaintained crates are reported only when mxt depends on them directly;
# replacing transitive ones (for example in matrix-sdk) is upstream's job.
# Vulnerabilities and yanked crates are denied everywhere.
unmaintained = "workspace"
yanked = "deny"
ignore = [
  # libsqlite3-sys 0.38.2 is pinned by matrix-sdk-sqlite 0.19 through rusqlite.
  # mxt does not enable the bundled SQLite: Nix builds link the flake's
  # SQLite (3.54.0, which has the fix); other builds link the system SQLite,
  # which must be 3.54.0 or newer.
  { id = "RUSTSEC-2026-0459", reason = "system SQLite is linked; the fix is in SQLite 3.54.0" },
]

[sources]
# Crates come from crates.io, except edtui from mxt's fork (design, "Nix
# flake"). Any other registry or git repository is denied.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/kisepichu/edtui"]
